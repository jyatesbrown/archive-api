name = "archive-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[observability]
enabled = true

[vars]
# JSON: { "<source name>": { "entityFields": ["field", ...] } }
SOURCE_CONFIG = '{"fixture_registry":{"entityFields":["entity"],"openArchive":true}}'
# Key prefix under which the harness syncs raw payloads (deploy/run_daily.sh).
PAYLOAD_PREFIX = "payloads/"
PRICING_URL = "https://archive-api.dev/pricing"
# Merchant of record adapter: "noop" or "lemonsqueezy".
BILLING_PROVIDER = "noop"
# For lemonsqueezy: LEMONSQUEEZY_STORE = "<slug>", LEMONSQUEEZY_VARIANTS = '{"indie":"123","team":"456","bulk":"789"}',
# plus secrets LEMONSQUEEZY_API_KEY and LEMONSQUEEZY_WEBHOOK_SECRET (wrangler secret put). See RUNBOOK §4.5.
# Key prefix of published Parquet exports (scripts/export-parquet.ts + its upload.sh).
# Bulk export also needs the secret EXPORT_SIGNING_SECRET (wrangler secret put); unset = endpoint answers 503.
EXPORT_PREFIX = "exports/"

[[d1_databases]]
binding = "DB"
database_name = "archive-index"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "archive-store"

# Per-key monthly call counters (see src/stores/cloudflare.ts MonthlyCounter).
[[durable_objects.bindings]]
name = "METER"
class_name = "MonthlyCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonthlyCounter"]
